[project]
name = "product-support-copilot-interview"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.5",
    "langchain-anthropic>=1.7.6",
    "langgraph>=1.2.14",
    "langsmith>=0.14.7",
]

[tool.ruff]
line-length = 88

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "live: calls the real Anthropic/LangSmith services; needs API keys, run manually",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
